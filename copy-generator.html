<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copy · RetentionQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
/* Layout: a copywriter's desk — narrow brief column on the left, the working sheet on the right; library and client memory as sibling tabs. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f4f4f4; --ink:#27282A; --muted:#4b4b4f; --faint:#8a8a8e; --line:#e6e6e6;
  --accent:#27282A; --accent-ink:#ffffff; --accent-soft:#FEF5F5; --coral:#FE7577;
  --ok:#1d7349; --ok-soft:#e3f3e9; --no:#b42318; --no-soft:#fdecea; --warn:#8a5a10;
  --f-display:"General Sans",Arial,sans-serif;
  --f-body:"General Sans",Arial,sans-serif;
  --f-mono:"General Sans",Arial,sans-serif;
  --r:8px; --shadow:none; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f10; --surface:#18191b; --sunk:#202123; --ink:#f5f5f3; --muted:#b8b7b2; --faint:#7a7975; --line:#2c2c2f;
  --accent:#f5f5f3; --accent-ink:#141414; --accent-soft:rgba(254,117,119,.16); --coral:#FE7577;
  --ok:#6fd19c; --ok-soft:#173226; --no:#ff9a86; --no-soft:#3a1f1a; --warn:#e7b567; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f10; --surface:#18191b; --sunk:#202123; --ink:#f5f5f3; --muted:#b8b7b2; --faint:#7a7975; --line:#2c2c2f;
  --accent:#f5f5f3; --accent-ink:#141414; --accent-soft:rgba(254,117,119,.16); --coral:#FE7577;
  --ok:#6fd19c; --ok-soft:#173226; --no:#ff9a86; --no-soft:#3a1f1a; --warn:#e7b567; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);min-height:100vh}
[hidden]{display:none!important}
h1,h2,h3,h4{font-weight:500!important;letter-spacing:-0.02em}
.pill.acc{color:var(--ink)!important;background:var(--accent-soft)!important;box-shadow:inset 0 0 0 1px var(--coral)}
.lbl,.pill,.mono,.small{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
@media(min-width:720px){.wrap{padding-inline:28px}}

.pill{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--no)}
.doc h3{font-size:19px;margin:18px 0 8px}
.doc h4{font-size:16px;margin:14px 0 6px}
.doc h3:first-child,.doc h4:first-child{margin-top:0}
.doc p{margin:0 0 10px}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc blockquote{margin:12px 0;padding:8px 12px;border-left:3px solid var(--warn);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px;color:var(--muted)}
.doc hr{border:0;border-top:1px dashed var(--line);margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.gate{max-width:520px;margin:12vh auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding-inline:16px}
.gate h1{font-size:26px}

/* client share view */
.share{max-width:780px;margin:0 auto;padding:40px 16px 80px}
.share-head{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
.share-head .eyebrow{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.share-head h1{font-size:clamp(28px,5vw,40px);margin:6px 0 8px;letter-spacing:-.015em}
.share-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.share-item header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.share-item header h2{font-size:18px}
.share-item .out{min-height:0}
.step{font:500 12px var(--f-mono);color:var(--accent);margin-right:8px}
</style>
</head>
<body>

<div id="gate" class="gate">
  <p class="muted dots">Wczytuję</p>
</div>
<div id="shareview" class="share" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
// Public client view of a shared copy or sequence (?share=token). Copy Generator itself is a section of
// Maximus (index.html?section=copygen); any other visit to this page is sent there.
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const qs=new URLSearchParams(location.search);
const share=qs.get("share");
if(!share||!/^[a-z0-9]{8,32}$/.test(share)){
  const next=new URLSearchParams({section:"copygen"});
  if(qs.get("client"))next.set("brand",qs.get("client"));
  location.replace("index.html?"+next.toString());
}
const firebaseConfig = {
  apiKey: "AIzaSyCzXWLpAK-GDGMcp1Hkwoztz7IN8VuaN_o",
  authDomain: "mailerq.firebaseapp.com",
  projectId: "mailerq",
  storageBucket: "mailerq.firebasestorage.app",
  messagingSenderId: "149160081533",
  appId: "1:149160081533:web:e1843467e285848604d914"
};

const fdb = getFirestore(initializeApp(firebaseConfig));

const FORMATS = {
  email:  {label:"E-mail", guide:"Struktura: **Temat:** (3 warianty, max ok. 45 znaków), **Preheader:** (max ok. 90 znaków), potem treść maila z nagłówkiem (## ), krótkimi akapitami, ewentualnie listą korzyści, i **CTA:** (tekst przycisku, 2-4 słowa)."},
  sms:    {label:"SMS", guide:"Podaj 3 warianty SMS, każdy max 160 znaków (wliczając link placeholder {link}), pod każdym licznik znaków w nawiasie. Nadawca nie jest częścią treści."},
  push:   {label:"Push", guide:"Podaj 3 warianty: **Tytuł:** max 45 znaków, **Treść:** max 110 znaków. Pod każdym licznik znaków."},
  inapp:  {label:"In-app / on-site", guide:"Struktura: **Nagłówek:**, **Treść:** (1-3 zdania), **CTA główne:**, opcjonalnie **CTA drugie:**. Podaj 2 warianty."},
  landing:{label:"Landing / sekcja strony", guide:"Rozpisz sekcje (## Nazwa sekcji): hero (nagłówek, podtytuł, CTA), korzyści, dowody, FAQ jeśli pasuje, CTA końcowe."},
  social: {label:"Social / reklama", guide:"Podaj 3 warianty: **Tekst główny:**, **Nagłówek:** (max 40 znaków), **Opis:** (max 30 znaków), **CTA:**."},
  other:  {label:"Inne", guide:"Dobierz strukturę do briefu."}
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = t => t ? new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(t)) : "";
const fmtDay = t => t ? new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"short",year:"numeric"}).format(new Date(t)) : "";
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
async function copyText(text,html){
  try{
    if(html && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({"text/plain":new Blob([text],{type:"text/plain"}),"text/html":new Blob([html],{type:"text/html"})})]);
    } else await navigator.clipboard.writeText(text);
    toast("Skopiowano");
  }catch{
    try{await navigator.clipboard.writeText(text);toast("Skopiowano")}
    catch{toast("Nie udało się skopiować – zaznacz tekst ręcznie")}
  }
}

/* ---------- markdown-lite ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g,"$1<em>$2</em>")}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n");let html="",para=[],list=null;
  const fp=()=>{if(para.length){html+="<p>"+para.map(inline).join("<br>")+"</p>";para=[]}};
  const fl=()=>{if(list){html+=`<${list.t}>`+list.items.map(i=>"<li>"+inline(i)+"</li>").join("")+`</${list.t}>`;list=null}};
  for(const raw of lines){
    const l=raw.trimEnd();let m;
    if(!l.trim()){fp();fl();continue}
    if(m=l.match(/^(#{1,4})\s+(.*)$/)){fp();fl();html+=(m[1].length<=2?"<h3>":"<h4>")+inline(m[2])+(m[1].length<=2?"</h3>":"</h4>");continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){fp();fl();html+="<hr>";continue}
    if(m=l.match(/^>\s?(.*)$/)){fp();fl();html+="<blockquote>"+inline(m[1])+"</blockquote>";continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)$/)){fp();if(!list||list.t!=="ul"){fl();list={t:"ul",items:[]}}list.items.push(m[1]);continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)$/)){fp();if(!list||list.t!=="ol"){fl();list={t:"ol",items:[]}}list.items.push(m[1]);continue}
    fl();para.push(l);
  }
  fp();fl();return html;
}
const plain = s => String(s||"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/^#{1,4}\s+/gm,"").replace(/^>\s?/gm,"").trim();


function showShareError(h,p){const v=$("#shareview");v.hidden=false;$("#gate").hidden=true;v.innerHTML=`<div class="gate"><h1>${esc(h)}</h1><p class="muted">${esc(p)}</p></div>`}
let shareDoc=null;
async function showShare(token){
  let snap;try{snap=await getDoc(doc(fdb,"copylabShares",token))}catch(e){return showShareError("Nie udało się wczytać","Odśwież stronę za chwilę.")}
  if(!snap.exists())return showShareError("Link nieaktywny","Ten link wygasł albo został wyłączony. Poproś o nowy.");
  const s=snap.data();const grp=s.kind==="group";shareDoc=s;
  const v=$("#shareview");v.hidden=false;$("#gate").hidden=true;
  v.innerHTML=`<div class="share-head">
      <div class="eyebrow">${esc(s.clientName)} · ${grp?"sekwencja":"copy"} do akceptacji</div>
      <h1>${esc(s.title)}</h1>
      <div class="mono muted">Udostępniono ${esc(fmtDate(s.updatedAt))}${grp?` · ${s.items.length} kroków`:""}</div>
    </div>`+(s.items||[]).map((c,i)=>`<article class="share-item">
      <header><h2>${grp?`<span class="step">${i+1}/${s.items.length}</span>`:""}${esc(c.name)}</h2>
        <div class="row" style="gap:6px"><span class="pill">${esc(FORMATS[c.format]?.label||"")}</span><span class="mono muted">${esc(fmtDay(c.createdAt))}</span><button class="btn ghost" data-i="${i}">Kopiuj</button></div></header>
      <div class="out doc">${md(c.text)}</div></article>`).join("");
  document.title=s.title;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;const c=shareDoc?.items?.[+b.dataset.i];if(c)copyText(plain(c.text),md(c.text))});
if(share)showShare(share);
</script>
</body>
</html>
